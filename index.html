<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ключ к гостю</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6ead2;--acc:#e8773c;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14213d;--acc:#ff5fa0}}
:root[data-theme="dark"]{--bg:#14213d;--acc:#ff5fa0}
*{box-sizing:border-box}html{height:100%}
body{margin:0;min-height:100%;background:var(--bg);font-family:'Montserrat',system-ui,sans-serif}
.wrap{max-width:460px;min-height:100vh;margin:0 auto;padding:24px 18px 32px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:24px}
.stage{perspective:1200px;width:100%;display:flex;justify-content:center}
.card{width:min(100%,360px);aspect-ratio:560/784;position:relative;transform-style:preserve-3d;transition:transform .8s cubic-bezier(.2,.8,.2,1);border-radius:22px;box-shadow:0 14px 34px #0004}
.card.flip{transform:rotateY(180deg)}
.card img{position:absolute;inset:0;width:100%;height:100%;border-radius:22px;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.card .f{transform:rotateY(180deg)}
.card.shake{animation:sh .5s}
@keyframes sh{0%,100%{transform:rotate(0)}25%{transform:rotate(-4deg)}75%{transform:rotate(4deg)}}
.go{width:100%;max-width:360px;border:0;border-radius:18px;padding:18px;font:800 22px 'Montserrat',system-ui,sans-serif;background:var(--acc);color:#fff;cursor:pointer;box-shadow:0 6px 0 #0003}
.go:active{transform:translateY(3px);box-shadow:0 3px 0 #0003}
</style></head><body><div class="wrap">
<div class="stage" id="stage"></div>
<button class="go" id="go">Старт</button>
</div>

const stage=document.getElementById("stage"),go=document.getElementById("go");
let last=-1,busy=false;
go.onclick=()=>{
 if(busy)return;busy=true;
 let i;do{i=Math.floor(Math.random()*CARDS.length)}while(i===last&&CARDS.length>1);last=i;
 const c=CARDS[i];stage.innerHTML="";
 const d=document.createElement("div");d.className="card shake";
 d.innerHTML='<img class="b" src="'+BACKS[c.c]+'" alt=""><img class="f" src="'+c.s+'" alt="Карточка игры">';
 stage.appendChild(d);
 setTimeout(()=>{d.classList.remove("shake");d.classList.add("flip")},450);
 setTimeout(()=>{busy=false},1100);
};
</script></body></html>
